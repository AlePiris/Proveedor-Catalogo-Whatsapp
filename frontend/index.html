<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon placeholder (Navbar lo re-apunta al logo del dueño cuando la
         config tiene imagen: la imagen es el interruptor). -->
    <link id="favicon" rel="icon" href="data:," />
    <!-- Fuentes de marca: Archivo Black (títulos, estilo display deportivo)
         + Manrope (texto). Cargan desde el CDN de Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Pedidos por WhatsApp</title>
  </head>
  <body>
    <!-- React monta toda la app dentro de este div. -->
    <div id="root"></div>
    <!-- type=module: el navegador carga ES modules. Vite inyecta el script real. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
